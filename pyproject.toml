[project]
name = "lakebase-payer-search"
version = "0.1.0"
description = "Typo-tolerant insurer search served as a REST API by the Lakebase Data API"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyarrow>=15", "requests>=2.31", "databricks-sdk>=0.147", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
load = ["locust>=2.29"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: calls the live Data API (needs .env)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurer_search"]
